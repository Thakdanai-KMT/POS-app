<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your account</p>
    </div>

    <!-- ใช้ [formGroup] กับ FormGroup ของ Angular -->
    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submitForm()" novalidate>
      
      <!-- Username / Email / Phone -->
      <div class="form-group">
        <div class="input-wrapper">
          <input
            type="text"
            formControlName="loginId"
            required
            autocomplete="username"
          />
          <label>Username / Email / Phone</label>
          <span class="focus-border"></span>
        </div>
        <span class="error-message" *ngIf="f.loginId.invalid && f.loginId.touched">
          Username is required
        </span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <div class="input-wrapper password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            required
            autocomplete="current-password"
          />
          <label>Password</label>
          <button type="button" class="password-toggle" (click)="togglePassword()" aria-label="Toggle password visibility">
            <span class="eye-icon"></span>
          </button>
          <span class="focus-border"></span>
        </div>
        <span class="error-message" *ngIf="f.password.invalid && f.password.touched">
          Password is required (min 6 characters)
        </span>
      </div>

      <!-- Remember me -->
      <div class="form-options">
        <label class="remember-wrapper">
          <input type="checkbox" formControlName="remember" />
          <span class="checkbox-label">
            <span class="checkmark"></span>
            Remember me
          </span>
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>

      <!-- Submit button -->
      <button type="submit" class="login-btn btn" [disabled]="isSubmitting">
        <span class="btn-text">Sign In</span>
        <span class="btn-loader" *ngIf="isSubmitting"></span>
      </button>
    </form>

    <!-- Sign up link -->
    <div class="signup-link">
      <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>

    <!-- Success message -->
    <div class="success-message" *ngIf="successState">
      <div class="success-icon">✓</div>
      <h3>Login Successful!</h3>
      <p>Redirecting to your dashboard...</p>
    </div>
  </div>
</div>
