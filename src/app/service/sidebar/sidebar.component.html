<aside class="sidebar" [class.collapsed]="isCollapsed">
  <!-- Toggle Button -->
  <button class="toggle-btn" (click)="toggleSidebar()" aria-label="Toggle sidebar">
    <span class="material-icons">{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</span>
  </button>

  <!-- Logo Section -->
  <div class="logo-section">
    <div class="logo-icon">
      <span class="material-icons">{{ isCollapsed ? 'widgets' : 'web' }}</span>
    </div>
    <h1 class="logo-text" *ngIf="!isCollapsed">MyApp</h1>
  </div>

  <!-- Navigation Menu -->
  <nav class="nav-menu">
    <div class="menu-section">
      <p class="section-title" *ngIf="!isCollapsed">MENU</p>
      <ul class="menu-list">
        <li *ngFor="let item of menuItems" 
            class="menu-item" 
            [class.active]="activeRoute === item.route"
            (click)="navigateTo(item.route)">
          <div class="menu-link">
            <span class="material-icons menu-icon">{{ item.icon }}</span>
            <span class="menu-label" *ngIf="!isCollapsed">{{ item.label }}</span>
            <span class="badge" *ngIf="item.badge && !isCollapsed">{{ item.badge }}</span>
          </div>
        </li>
      </ul>
    </div>
  </nav>

  <!-- User Profile Section -->
  <div class="user-section">
    <div class="user-profile">
      <img [src]="userInfo.avatar" alt="User Avatar" class="user-avatar" />
      <div class="user-info" *ngIf="!isCollapsed">
        <p class="user-name">{{ userInfo.name }}</p>
        <p class="user-email">{{ userInfo.email }}</p>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()" [title]="isCollapsed ? 'Logout' : ''">
      <span class="material-icons">logout</span>
      <span *ngIf="!isCollapsed">Logout</span>
    </button>
  </div>
</aside>
